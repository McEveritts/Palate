<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Palate — Offline</title>
  <style>
    :root {
      --color-slate-950: #020617;
      --color-indigo-400: #818cf8;
      --color-indigo-500: #6366f1;
      --color-fuchsia-500: #d946ef;
      --font-sans: 'Inter', ui-sans-serif, system-ui, -apple-system, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--color-slate-950);
      color: #ffffff;
      font-family: var(--font-sans);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      overflow: hidden;
      position: relative;
    }

    /* Aurora Background Radial Orbs */
    .aurora-1 {
      position: fixed;
      top: -20%;
      left: -10%;
      width: 80vw;
      height: 60vh;
      background: radial-gradient(ellipse, rgba(99, 102, 241, 0.3) 0%, transparent 60%);
      filter: blur(100px);
      z-index: 0;
      pointer-events: none;
      animation: aurora 20s ease-in-out infinite alternate;
    }

    .aurora-2 {
      position: fixed;
      bottom: -30%;
      right: -10%;
      width: 80vw;
      height: 60vh;
      background: radial-gradient(ellipse, rgba(217, 70, 239, 0.25) 0%, transparent 60%);
      filter: blur(120px);
      z-index: 0;
      pointer-events: none;
      animation: aurora 25s ease-in-out infinite alternate;
    }

    @keyframes aurora {
      0% { transform: translate(0, 0) rotate(0deg); }
      100% { transform: translate(5%, 5%) rotate(10deg) scale(1.05); }
    }

    /* Standalone Screen Vignette */
    .vignette {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, transparent 20%, rgba(2, 6, 23, 0.8) 100%);
      z-index: 1;
      pointer-events: none;
    }

    /* Content Container */
    .container {
      position: relative;
      z-index: 10;
      width: 90%;
      max-width: 440px;
      padding: 2.5rem 2rem;
      text-align: center;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.03) 0%, rgba(255, 255, 255, 0) 100%);
      backdrop-filter: blur(36px);
      -webkit-backdrop-filter: blur(36px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-top: 1px solid rgba(255, 255, 255, 0.15);
      border-left: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 1.5rem;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
    }

    /* Sage Icon Badge */
    .logo-wrapper {
      width: 5rem;
      height: 5rem;
      margin: 0 auto 1.5rem;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.15), rgba(217, 70, 239, 0.15));
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 0 30px rgba(99, 102, 241, 0.3), inset 0 2px 10px rgba(255, 255, 255, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      text-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
      animation: float 4s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.025em;
      margin-bottom: 0.75rem;
      background: linear-gradient(to right, #ffffff, #a5b4fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 15px rgba(255, 255, 255, 0.1);
    }

    p {
      font-size: 0.95rem;
      line-height: 1.6;
      color: #94a3b8;
      margin-bottom: 2rem;
    }

    /* Interactive Retry Button */
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      width: 100%;
      padding: 0.85rem;
      font-size: 0.95rem;
      font-weight: 600;
      color: #ffffff;
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.8), rgba(217, 70, 239, 0.8));
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 0.75rem;
      box-shadow: 0 4px 20px rgba(99, 102, 241, 0.25);
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .btn:hover {
      transform: scale(1.02);
      border-color: rgba(255, 255, 255, 0.4);
      box-shadow: 0 4px 25px rgba(99, 102, 241, 0.35);
    }

    .btn:active {
      transform: scale(0.98);
    }

    /* Offline Icon Graphic inside button */
    .btn svg {
      width: 1.1rem;
      height: 1.1rem;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
  </style>
</head>
<body>
  <div class="aurora-1"></div>
  <div class="aurora-2"></div>
  <div class="vignette"></div>

  <div class="container">
    <div class="logo-wrapper">🌿</div>
    <h1>No Connection</h1>
    <p>Sage is resting while your device is disconnected from the culinary matrix. We'll resume cooking once you're online.</p>
    <button class="btn" onclick="window.location.reload()">
      <svg viewBox="0 0 24 24">
        <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
      </svg>
      Reconnect to Sage
    </button>
  </div>
</body>
</html>
