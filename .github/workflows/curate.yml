name: "🌿 Curated By Sage"

on:
  schedule:
    # Fires at 6:59 AM UTC every Monday, Wednesday, and Friday
    - cron: "59 6 * * 1,3,5"
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  curate:
    name: Generate Tri-Weekly Recipes
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Curation
        env:
          DEPLOYMENT_URL: ${{ secrets.DEPLOYMENT_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$DEPLOYMENT_URL" ]; then
            echo "::error::DEPLOYMENT_URL secret is not set. See README for setup instructions."
            exit 1
          fi

          echo "🌿 Triggering Sage curation at $DEPLOYMENT_URL/api/curate"

          HTTP_STATUS=$(curl -s -o /tmp/curate_response.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" \
            "$DEPLOYMENT_URL/api/curate" \
            --max-time 120)

          RESPONSE=$(cat /tmp/curate_response.json)
          echo "Response ($HTTP_STATUS): $RESPONSE"

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "✅ Curation completed successfully"
          else
            echo "::error::Curation failed with HTTP $HTTP_STATUS"
            exit 1
          fi
